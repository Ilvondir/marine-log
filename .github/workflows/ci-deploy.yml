name: CI & Deploy

on:
  pull_request:
    branches: [ '**' ]
  push:
    branches: [ main, master ]

jobs:
  tests:
    name: Run tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: marinelog
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=3
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: marinelog
      DB_USERNAME: root
      DB_PASSWORD: password
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, xml, curl, gd, zip, pdo_mysql

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Install system deps (composer)
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare environment
        run: |
          cp .env.example .env || true
          php -r "file_exists('.env') || copy('.env.example', '.env');"
        shell: bash

      - name: Generate application key
        run: php artisan key:generate --force

      - name: Link storage
        run: php artisan storage:link

      - name: Wait for MySQL
        run: |
          n=0; until mysqladmin ping -h127.0.0.1 -uroot -ppassword >/dev/null 2>&1 || [ $n -ge 30 ]; do n=$((n+1)); sleep 1; done
        shell: bash

      - name: Run migrations
        run: php artisan migrate --force

      - name: Seed database
        run: php artisan db:seed --force

      - name: Run tests
        run: composer test

      - name: Check code style (Pint)
        run: ./vendor/bin/pint --test

  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    needs: tests
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: marinelog
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=3
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: marinelog
      DB_USERNAME: root
      DB_PASSWORD: password
      APP_URL: http://localhost:8000
      CI: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, xml, curl, gd, zip, pdo_mysql

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan storage:link

      - name: Wait for MySQL
        run: |
          n=0; until mysqladmin ping -h127.0.0.1 -uroot -ppassword >/dev/null 2>&1 || [ $n -ge 30 ]; do n=$((n+1)); sleep 1; done

      - name: Run migrations and seed
        run: |
          php artisan migrate --force
          php artisan db:seed --force

      - name: Build frontend assets
        run: npm run build

      - name: Start Laravel server
        run: php artisan serve --port=8000 &

      - name: Wait for app to be ready
        run: |
          n=0; until curl -s http://localhost:8000/up >/dev/null 2>&1 || [ $n -ge 30 ]; do n=$((n+1)); sleep 1; done

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  deploy:
    name: Deploy to Coolify
    runs-on: ubuntu-latest
    needs: [tests, e2e]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Trigger Coolify Deploy Webhook
        run: |
          if [ -z "$COOLIFY_DEPLOY_WEBHOOK" ]; then echo 'COOLIFY_DEPLOY_WEBHOOK not set'; exit 1; fi
          if [ -z "$COOLIFY_API_TOKEN" ]; then echo 'COOLIFY_API_TOKEN not set'; exit 1; fi
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"ref\": \"${GITHUB_REF_NAME}\"}" \
            "$COOLIFY_DEPLOY_WEBHOOK"
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
