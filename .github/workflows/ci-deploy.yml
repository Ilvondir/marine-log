name: CI & Deploy

on:
  pull_request:
    branches: [ '**' ]
  push:
    branches: [ main ]

jobs:
  tests:
    name: Run tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: marinelog
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=3
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: marinelog
      DB_USERNAME: root
      DB_PASSWORD: password
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v3
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, xml, curl, gd, zip, pdo_mysql

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Install system deps (composer)
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare environment
        run: |
          cp .env.example .env || true
          php -r "file_exists('.env') || copy('.env.example', '.env');"
        shell: bash

      - name: Wait for MySQL
        run: |
          n=0; until mysqladmin ping -h127.0.0.1 -uroot -ppassword >/dev/null 2>&1 || [ $n -ge 30 ]; do n=$((n+1)); sleep 1; done
        shell: bash

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run tests
        run: composer test

  deploy:
    name: Deploy to Coolify
    runs-on: ubuntu-latest
    needs: tests
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Coolify Deploy Webhook
        run: |
          if [ -z "$COOLIFY_DEPLOY_WEBHOOK" ]; then echo 'COOLIFY_DEPLOY_WEBHOOK not set'; exit 1; fi
          curl -s -X POST -H "Content-Type: application/json" -d "{\"ref\": \"main\"}" "$COOLIFY_DEPLOY_WEBHOOK"
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
